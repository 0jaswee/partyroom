<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171528"><meta name="description" content="Your people. One room. Endless good times. Play dice and truth or dare together on your phones."><title>PartyRoom · A little chaos, together.</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="improvements.css"></head><body>
<header><a class="brand" href="./"><span class="brand-icon">✳</span> partyroom<span class="brand-dot">●</span></a><div class="top-actions"><span id="connection" class="status">Getting ready</span><button id="theme" class="icon" aria-label="Switch color theme">☼</button></div></header>
<main id="app" aria-live="polite"></main><div id="toast" role="status"></div>
<footer><span>MADE FOR YOUR KIND OF PEOPLE</span><a href="context.html">Project & future plans ↗</a></footer>

<dialog id="scan-dialog"><button class="close icon" aria-label="Close scanner">×</button><h2>Scan a room invite</h2><video id="camera" autoplay playsinline muted></video><p id="scan-status">Point your camera at a PartyRoom QR code.</p><button id="stop-camera" class="secondary">Cancel</button></dialog>
